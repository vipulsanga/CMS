{% extends 'admin/base_site.html' %}

{% block title %}{{ title }} | CMS Admin{% endblock %}

{% block branding %}
<h1 id="site-name">
  <a href="{% url 'admin:index' %}">CMS Admin</a>
</h1>
<p style="margin: 0 0 12px; color: #b9c3d4; font-size: 0.95rem;">Content Management Hub</p>
{% endblock %}

{% block extrastyle %}
{{ block.super }}
<style>
  :root {
    --primary: #2563eb;
    --secondary: #0f172a;
    --accent: #38bdf8;
  }

  body {
    background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
    color: #f8fafc;
  }

  #header {
    background: linear-gradient(135deg, var(--secondary) 0%, #1e293b 100%);
    border-bottom: 2px solid var(--accent);
  }

  #site-name a {
    color: #f8fafc;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .module h2, .module caption, .inline-group h2 {
    background: var(--primary);
    color: white;
  }

  .button, input[type=submit], input[type=button], .submit-row input {
    background: var(--primary);
    color: white;
    border: none;
  }

  .button:hover, input[type=submit]:hover, input[type=button]:hover, .submit-row input:hover {
    background: var(--accent);
  }

  #content-related, .module, .calendarbox, .clockbox {
    background: rgba(15, 23, 42, 0.9);
    color: #f8fafc;
  }
</style>
{% endblock %}

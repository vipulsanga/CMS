<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles - CMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" data-type="module">
        const articles = {{ articles_data|safe }};

        const formatDate = (dateString) => {
            if (!dateString) return '';
            return new Date(dateString).toLocaleDateString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
            });
        };

        const ArticleList = ({ articles = [] }) => (
            <div>
                <nav className="navbar navbar-expand-lg navbar-dark bg-primary">
                    <div className="container">
                        <a className="navbar-brand" href="/">CMS Articles</a>
                        <button className="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                            <span className="navbar-toggler-icon"></span>
                        </button>
                        <div className="collapse navbar-collapse" id="navbarNav">
                            <ul className="navbar-nav ms-auto">
                                <li className="nav-item">
                                    <a className="btn btn-light btn-sm ms-2" href="/admin/" target="_blank" rel="noopener noreferrer">
                                        Admin Panel
                                    </a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>

                <div className="container mt-4">
                    <h1 className="mb-4">Latest Articles</h1>
                    <div className="row">
                        {articles.length > 0 ? articles.map((article) => (
                            <div className="col-md-6 col-lg-4 mb-4" key={article.id}>
                                <div className="card h-100">
                                    <div className="card-body">
                                        <h5 className="card-title">{article.title}</h5>
                                        <p className="card-text text-muted">Published on {formatDate(article.created_at)}</p>
                                        <a href={`/articles/${article.id}/`} className="btn btn-primary">Read More</a>
                                    </div>
                                </div>
                            </div>
                        )) : (
                            <div className="col-12">
                                <p className="text-center">No articles available yet.</p>
                            </div>
                        )}
                    </div>
                </div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ArticleList articles={articles} />);
    </script>
</body>
</html>
